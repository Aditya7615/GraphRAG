services:
  - type: web
    name: lengraph-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_URL
        value: https://YOUR_CLUSTER.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false
      - key: DOCSTORE_BACKEND
        value: json
      - key: LLM_MODEL
        value: gemini-2.0-flash
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: lengraph-ui
    runtime: docker
    dockerfilePath: Dockerfile.streamlit
    envVars:
      - key: API_URL
        value: http://lengraph-api:8000
    autoDeploy: true
